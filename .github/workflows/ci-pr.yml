name: CI (monorepo)

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      files: ${{ steps.filter.outputs.files }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'nebulavault-frontend/**'
            auth:
              - 'benzene-auth-service/**'
            gateway:
              - 'nebula-gateway/**'
            files:
              - 'nebulavault-file-service/**'
            infra:
              - 'infrastructure/**'

  web:
    name: Frontend (Next.js) — build
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebulavault-frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GATEWAY_ORIGIN: http://localhost:8080
      GATEWAY_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nebulavault-frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev; else npm i; fi
      - name: Lint (if present)
        run: |
          if npm run -s | grep -qE '(^| )lint( |$)'; then
            npm run lint || echo "lint had issues (not failing CI)"
          fi
      - name: Typecheck (if present)
        run: npm run typecheck --if-present
      - name: Build (with fallback)
        run: |
          if npm run -s | grep -qE '(^| )build( |$)'; then
            npm run build
          else
            npx --yes next build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: |
            nebulavault-frontend/.next
            nebulavault-frontend/next.config.*
            nebulavault-frontend/package*.json

  auth:
    name: Auth (Node/TS) — build & test
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benzene-auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: benzene-auth-service/package-lock.json
      - name: Install
        run: npm install
      - name: Build (with fallback)
        run: |
          if npm run -s | grep -qE '(^| )build( |$)'; then
            npm run build
          else
            npx --yes tsc -p tsconfig.json
          fi
      - name: Test (if present)
        run: npm test --if-present

  gateway:
    name: Gateway (Spring Boot) — package
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebula-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: |
          chmod +x mvnw || true
          ./mvnw -B -ntp test
      - name: Package
        run: ./mvnw -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-jar
          path: nebula-gateway/target/*.jar

  files:
    name: File service (Node/TS) — build & test
    needs: detect-changes
    if: needs.detect-changes.outputs.files == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebulavault-file-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nebulavault-file-service/package-lock.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
      - name: Test (if present)
        run: npm test --if-present

  infra:
    name: Terraform — format & validate
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend, no credentials needed)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
